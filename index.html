<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sudoku Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: #121214; 
            color: #e1e1e6; 
            text-align: center; 
            margin: 0; 
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            box-sizing: border-box;
        }
        
        h3 { 
            font-size: 22px; 
            margin: 0 0 10px 0; 
            color: #deff9a; 
            font-weight: 600;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            width: 94vw;
            max-width: 420px;
            margin-bottom: 15px;
            font-size: 16px;
            color: #c4c4cc;
            font-weight: 500;
        }

        .mistakes-badge {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 107, 107, 0.2);
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(9, 1fr); 
            grid-template-rows: repeat(9, 1fr);
            gap: 1px; 
            width: 94vw; 
            max-width: 420px; 
            aspect-ratio: 1 / 1; 
            background: #29292e; 
            border: 3px solid #deff9a; 
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            transition: opacity 0.3s ease;
        }
        
        .cell { 
            background: #1c1c1e; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 5.5vw; 
            font-weight: bold;
        }

        @media (min-width: 450px) {
            .cell { font-size: 24px; }
        }
        
        .cell.fixed { 
            background: #121214; 
            color: #8d8d99; 
        }
        
        .thick-right { border-right: 2px solid #555861; }
        .thick-bottom { border-bottom: 2px solid #555861; }
        
        input { 
            width: 100%; 
            height: 100%; 
            background: transparent; 
            color: #ffffff; 
            border: none; 
            text-align: center; 
            font-size: inherit; 
            font-weight: 600;
            outline: none; 
            padding: 0;
            transition: color 0.2s, background-color 0.2s;
        }

        input.correct { color: #deff9a; background: transparent; }
        input.wrong { color: #ff6b6b; background: rgba(255, 107, 107, 0.05); }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        #result-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            animation: fadeIn 0.5s;
            padding: 20px;
        }

        #waiting-screen { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 60vh; 
        }

        .loader { 
            border: 4px solid #29292e; 
            border-top: 4px solid #deff9a; 
            border-radius: 50%; 
            width: 40px; 
            height: 40px; 
            animation: spin 1s linear infinite; 
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .btn { 
            background: #deff9a; 
            color: #0b0f19; 
            border: none; 
            padding: 16px 32px; 
            font-weight: bold;
            border-radius: 12px; 
            font-size: 18px; 
            cursor: pointer; 
            margin-top: 30px;
            box-shadow: 0 4px 12px rgba(222, 255, 154, 0.2);
            transition: background 0.1s;
        }
        .btn:active { background: #bdde79; }
    </style>
</head>
<body>
    <div id="waiting-screen">
        <div class="loader"></div>
        <p style="margin-top: 20px; font-size: 18px; color: #c4c4cc;">Очікуємо опонента...</p>
    </div>

    <div id="game-container">
        <h3>Sudoku Challenge 🧩</h3>
        <div class="status-bar" id="status-bar">
            <div id="diff-label">Складність: ...</div>
            <div class="mistakes-badge" id="mistakes-label">Помилки: 0 / 3</div>
        </div>
        <div id="grid" class="grid"></div>
    </div>

    <div id="result-screen">
        <h1 id="result-title" style="font-size: 32px; margin: 0 0 15px 0; text-align: center;"></h1>
        <p id="result-desc" style="color: #a1a1aa; font-size: 18px; margin: 0; text-align: center; line-height: 1.5; max-width: 360px;"></p>
        <button class="btn" onclick="Telegram.WebApp.close()">Повернутися в чат</button>
    </div>

    <script>
        window.tg = window.Telegram.WebApp;
        window.tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const puzzle = (urlParams.get('puz') || '').replace(/\D/g, '');
        const solution = (urlParams.get('sol') || '').replace(/\D/g, '');
        const difficulty = urlParams.get('diff') || 'Easy';
        const gameId = urlParams.get('game_id') || '';
        const gameType = urlParams.get('type') || 'single';

        const userId = window.tg.initDataUnsafe?.user?.id || 'unknown';
        const userName = window.tg.initDataUnsafe?.user?.first_name || 'Гравець';

        const N8N_DUEL_WEBHOOK = 'https://herasymchuk.app.n8n.cloud/webhook/sudoku-duel-status'; 

        let mistakes = 0;
        let maxMistakes = (difficulty === 'Hard' || difficulty === 'Важка') ? 2 : 3;
        let isGameOver = false;
        let isGameStarted = (gameType !== 'duel');
        
        const waitingScreen = document.getElementById('waiting-screen');
        const gameContainer = document.getElementById('game-container');

        if (!isGameStarted) {
            gameContainer.style.display = 'none';
            waitingScreen.style.display = 'flex';
        }

        document.getElementById('diff-label').innerText = `Режим: ${gameType === 'duel' ? '⚔️ Дуель' : '👤 Одиночна'}`;
        document.getElementById('mistakes-label').innerText = `Помилки: ${mistakes} / ${maxMistakes}`;

        const gridEl = document.getElementById('grid');
        let inputs = [];

        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            
            const row = Math.floor(i / 9);
            const col = i % 9;
            if (col === 2 || col === 5) cell.classList.add('thick-right');
            if (row === 2 || row === 5) cell.classList.add('thick-bottom');

            if (puzzle[i] !== '0' && puzzle[i] !== undefined) {
                cell.innerText = puzzle[i];
                cell.classList.add('fixed');
            } else {
                const input = document.createElement('input');
                input.type = 'number';
                input.pattern = '[1-9]*';
                input.inputMode = 'numeric';
                
                input.oninput = function() {
                    if (isGameOver || !isGameStarted) return;

                    if (this.value.length > 1) this.value = this.value.slice(0, 1);
                    const val = this.value;

                    if (!val) {
                        this.className = '';
                        return;
                    }

                    if (val === solution[i]) {
                        this.className = 'correct';
                        checkWin();
                    } else {
                        this.className = 'wrong';
                        mistakes++;
                        document.getElementById('mistakes-label').innerText = `Помилки: ${mistakes} / ${maxMistakes}`;
                        
                        if (mistakes >= maxMistakes) {
                            if (gameId) {
                                fetch(N8N_DUEL_WEBHOOK, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        action: 'submit_loss',
                                        game_id: gameId,
                                        user_id: userId,
                                        user_name: userName
                                    })
                                }).catch(e => console.error(e));
                            }
                            endGame(false, 'Ви вичерпали ліміт помилок.');
                        }
                    }
                };

                cell.appendChild(input);
                inputs.push({el: input, index: i});
            }
            gridEl.appendChild(cell);
        }

        let pollInterval;
        if (gameType === 'duel' && gameId) {
            pollInterval = setInterval(async () => {
                if (isGameOver) {
                    clearInterval(pollInterval);
                    return;
                }
                try {
                    const response = await fetch(N8N_DUEL_WEBHOOK, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'check',
                            game_id: gameId,
                            user_id: userId
                        })
                    });
                    if (response.ok) {
                        const data = await response.json();

                        if (!isGameStarted) {
                            if (data.property_player_2 || data.player_2) {
                                isGameStarted = true;
                                waitingScreen.style.display = 'none';
                                gameContainer.style.display = 'block';
                            }
                        }

                        if (data.status === 'Finished') {
                            clearInterval(pollInterval);
                            if (data.winner_id && String(data.winner_id) === String(userId)) {
                                endGame(true, '⚔️ ДУЕЛЬ ВИГРАНА!<br><br>Ви перемогли, оскільки ваш опонент припустився критичної кількості помилок! Красава! 🚀');
                            } else {
                                endGame(false, `Ви програли! <b>@${data.winner_name || 'Суперник'}</b> фінішував раніше або виявився точнішим. 🏁`);
                            }
                        }
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 5000);
        }

        async function checkWin() {
            let currentBoard = puzzle.split('');
            inputs.forEach(item => {
                currentBoard[item.index] = item.el.value || '0';
            });
            
            if (currentBoard.join('') === solution) {
                if (pollInterval) clearInterval(pollInterval);

                if (gameId) {
                    try {
                        const response = await fetch(N8N_DUEL_WEBHOOK, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                action: 'submit_win',
                                game_id: gameId,
                                user_id: userId,
                                user_name: userName
                            })
                        });
                        
                        if (gameType === 'duel') {
                            const data = await response.json();
                            if (data.result === 'victory') {
                                endGame(true, '⚔️ ДУЕЛЬ ВИГРАНА!<br><br>Ви ідеально розв’язали судоку першим! Обидва гравці отримали однакову сітку, але ви виявилися швидшим! Красава! 🚀');
                            } else {
                                endGame(false, `Ви програли! Хоч ви і розв'язали правильно, але <b>@${data.winner_name || 'Суперник'}</b> фінішував на декілька секунд раніше! 😭`);
                            }
                        } else {
                            endGame(true, 'Ви ідеально розв’язали судоку! 🎉');
                        }
                    } catch (e) {
                        endGame(true, 'Ви розв’язали судоку!');
                    }
                } else {
                    endGame(true, 'Ви ідеально розв’язали судоку! 🎉');
                }
            }
        }

        function endGame(isWin, customDesc = '') {
            isGameOver = true;
            if (pollInterval) clearInterval(pollInterval);

            setTimeout(() => {
                document.getElementById('game-container').style.display = 'none';
                document.getElementById('waiting-screen').style.display = 'none';
                
                const resScreen = document.getElementById('result-screen');
                const title = document.getElementById('result-title');
                const desc = document.getElementById('result-desc');
                
                resScreen.style.display = 'flex';
                
                if (isWin) {
                    title.innerText = '🎉 Перемога!';
                    title.style.color = '#deff9a';
                    desc.innerHTML = customDesc || 'Ви ідеально розв’язали судоку!';
                } else {
                    title.innerText = '❌ Гра закінчена';
                    title.style.color = '#ff6b6b';
                    desc.innerHTML = customDesc || 'Ви вичерпали ліміт помилок.';
                }
            }, 400); 
        }
    </script>
</body>
</html>
