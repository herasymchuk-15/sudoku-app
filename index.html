<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Sudoku Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 1px; max-width: 360px; margin: 20px auto; border: 2px solid #555; }
        .cell { width: 40px; height: 40px; background: #333; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
        .cell.fixed { background: #222; color: #aaa; cursor: default; }
        .cell:nth-child(3n) { border-right: 2px solid #555; }
        .cell:nth-child(27n) { border-bottom: 2px solid #555; }
        input { width: 100%; height: 100%; background: transparent; color: white; border: none; text-align: center; font-size: 20px; outline: none; }
        .btn { background: #248b6b; border: none; padding: 15px 30px; color: white; border-radius: 10px; font-size: 18px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <h3>Sudoku Challenge</h3>
    <div id="grid" class="grid"></div>
    <button class="btn" onclick="checkGame()">Перевірити результат</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Отримуємо пазл з URL (ми його надішлемо з n8n)
        const urlParams = new URLSearchParams(window.location.search);
        const puzzle = urlParams.get('puz') || '0'.repeat(81);
        const solution = urlParams.get('sol');

        const gridEl = document.getElementById('grid');
        let inputs = [];

        // Малюємо сітку
        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            if (puzzle[i] !== '0') {
                cell.innerText = puzzle[i];
                cell.classList.add('fixed');
            } else {
                const input = document.createElement('input');
                input.type = 'number';
                input.max = 9;
                input.min = 1;
                input.oninput = function() { if(this.value.length > 1) this.value = this.value.slice(0,1); };
                cell.appendChild(input);
                inputs.push({el: input, index: i});
            }
            gridEl.appendChild(cell);
        }

        function checkGame() {
            let currentBoard = puzzle.split('');
            inputs.forEach(item => {
                currentBoard[item.index] = item.el.value || '0';
            });
            
            if (currentBoard.join('') === solution) {
                alert('Вітаємо! Ви розв’язали судоку!');
                tg.close();
            } else {
                alert('Є помилки. Спробуйте ще раз!');
            }
        }
    </script>
</body>
</html>
