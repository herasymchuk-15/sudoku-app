<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sudoku Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: #121214; 
            color: #e1e1e6; 
            text-align: center; 
            margin: 0; 
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            box-sizing: border-box;
        }
        
        h3 { 
            font-size: 22px; 
            margin: 0 0 10px 0; 
            color: #deff9a; 
            font-weight: 600;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            width: 94vw;
            max-width: 420px;
            margin-bottom: 15px;
            font-size: 16px;
            color: #c4c4cc;
            font-weight: 500;
        }

        .mistakes-badge {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 107, 107, 0.2);
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(9, 1fr); 
            grid-template-rows: repeat(9, 1fr);
            gap: 1px; 
            width: 94vw; 
            max-width: 420px; 
            aspect-ratio: 1 / 1; 
            background: #29292e; 
            border: 3px solid #deff9a; 
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        
        .cell { 
            background: #1c1c1e; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 5.5vw; 
            font-weight: bold;
        }

        @media (min-width: 450px) {
            .cell { font-size: 24px; }
        }
        
        .cell.fixed { 
            background: #121214; 
            color: #8d8d99; 
        }
        
        .thick-right { border-right: 2px solid #555861; }
        .thick-bottom { border-bottom: 2px solid #555861; }
        
        input { 
            width: 100%; 
            height: 100%; 
            background: transparent; 
            color: #ffffff; 
            border: none; 
            text-align: center; 
            font-size: inherit; 
            font-weight: 600;
            outline: none; 
            padding: 0;
            transition: color 0.2s, background-color 0.2s;
        }

        input.correct { color: #deff9a; }
        input.wrong { color: #ff6b6b; background: rgba(255, 107, 107, 0.05); }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        .btn { 
            background: #deff9a; 
            color: #0b0f19; 
            border: none; 
            padding: 16px; 
            font-weight: bold;
            border-radius: 12px; 
            font-size: 16px; 
            cursor: pointer; 
            margin-top: 24px;
            width: 94vw;
            max-width: 420px;
            box-shadow: 0 4px 12px rgba(222, 255, 154, 0.2);
        }
    </style>
</head>
<body>
    <h3>Sudoku Challenge 🧩</h3>
    
    <div class="status-bar">
        <div id="diff-label">Складність: ...</div>
        <div class="mistakes-badge" id="mistakes-label">Помилки: 0 / 3</div>
    </div>

    <div id="grid" class="grid"></div>
    <button class="btn" onclick="tg.close()">Закрити гру ❌</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const puzzle = urlParams.get('puz') || '0'.repeat(81);
        const solution = (urlParams.get('sol') || '').trim();
        const difficulty = urlParams.get('diff') || 'Easy';

        let mistakes = 0;
        let maxMistakes = (difficulty === 'Hard' || difficulty === 'Важка') ? 2 : 3;

        document.getElementById('diff-label').innerText = `Складність: ${difficulty}`;
        document.getElementById('mistakes-label').innerText = `Помилки: ${mistakes} / ${maxMistakes}`;

        const gridEl = document.getElementById('grid');
        let inputs = [];

        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            
            const row = Math.floor(i / 9);
            const col = i % 9;
            if (col === 2 || col === 5) cell.classList.add('thick-right');
            if (row === 2 || row === 5) cell.classList.add('thick-bottom');

            if (puzzle[i] !== '0') {
                cell.innerText = puzzle[i];
                cell.classList.add('fixed');
            } else {
                const input = document.createElement('input');
                input.type = 'number';
                input.pattern = '[1-9]*';
                input.inputMode = 'numeric';

                input.oninput = function() {
                    if (this.value.length > 1) this.value = this.value.slice(0, 1);
                    const val = this.value;

                    if (!val) {
                        this.className = '';
                        return;
                    }

                    if (val === solution[i]) {
                        this.className = 'correct';
                        checkWin();
                    } else {
                        this.className = 'wrong';
                        mistakes++;
                        document.getElementById('mistakes-label').innerText = `Помилки: ${mistakes} / ${maxMistakes}`;
                        
                        if (mistakes >= maxMistakes) {
                            setTimeout(() => {
                                alert('❌ Гра закінчена! Ви вичерпали ліміт помилок.');
                                tg.close();
                            }, 100);
                        }
                    }
                };

                cell.appendChild(input);
                inputs.push({el: input, index: i});
            }
            gridEl.appendChild(cell);
        }

        function checkWin() {
            let currentBoard = puzzle.split('');
            inputs.forEach(item => {
                currentBoard[item.index] = item.el.value || '0';
            });
            
            if (currentBoard.join('') === solution) {
                setTimeout(() => {
                    alert('🎉 Вітаємо! Ви ідеально розв’язали судоку!');
                    tg.close();
                }, 100);
            }
        }
    </script>
</body>
</html>
